# Change these first
owner: tmrw-health # Your GitHub organization or username, where this repository lives
repo: tmrw-status-page # The name of this repository

graphBorderColor: "#003d1c"
graphBackgroundColor: "rgba(0, 61, 28, 0.08)"

sites:
  - name: Member Dashboard
    url: https://app.startmytomorrow.com/
  - name: Core API
    url: https://api.core.startmytomorrow.com/health-check

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.startmytomorrow.com
  # baseUrl: /tmrw-status-page
  logoUrl: https://www.startmytomorrow.com/icon0.svg
  favicon: https://www.startmytomorrow.com/icon1.png
  faviconSvg: https://www.startmytomorrow.com/icon0.svg
  name: TMRW
  introTitle: System status
  introMessage: Live availability for the TMRW member dashboard and platform API.
  navbar:
    - title: Status
      href: /
    - title: TMRW
      href: https://www.startmytomorrow.com
  theme: light
  css: |
    @import url("https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&display=swap");
    @font-face {
      font-family: "Brown";
      src: url("https://www.startmytomorrow.com/fonts/Brown/Brown-Regular.otf") format("opentype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Apoc";
      src: url("https://www.startmytomorrow.com/fonts/Apoc/ApocRevelations-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Apoc";
      src: url("https://www.startmytomorrow.com/fonts/Apoc/ApocRevelations-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --tmrw-ink: #131313;
      --tmrw-line: #eaeaea;
      --tmrw-subtle: #767676;
      --tmrw-accent: #500000;
      --tmrw-up: #003d1c;
      --tmrw-degraded: #9d8000;
      --tmrw-down: #ff3300;

      --body-background-color: #ffffff;
      --body-text-color: #131313;
      --card-background-color: #ffffff;
      --card-border-color: #eaeaea;
      --nav-background-color: #ffffff;
      --nav-border-bottom-color: #eaeaea;
      --nav-current-border-bottom-color: #000000;
      --up-border-left-color: #eaeaea;
      --degraded-border-left-color: #eaeaea;
      --down-border-left-color: var(--tmrw-down);
      --down-background-color: #ffffff;
      --tag-color: #ffffff;
      --tag-up-background-color: var(--tmrw-up);
      --tag-down-background-color: var(--tmrw-down);
      --tag-degraded-background-color: var(--tmrw-degraded);
      --submit-button-background-color: #000000;
      --submit-button-border-color: #000000;
      --error-button-background-color: #000000;
      --error-button-border-color: #000000;
    }

    body {
      font-family: "Crimson Text", Georgia, serif;
      color: var(--tmrw-ink);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 0;
    }

    .container {
      max-width: 960px;
    }

    /* Nav */
    nav {
      margin-bottom: 5rem;
    }
    nav a {
      font-family: "Brown", sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 1.4rem 1.25rem !important;
    }
    nav .logo {
      padding: 0.75rem 0 !important;
    }
    nav .logo img {
      height: 1.75rem !important;
      margin-right: 0.6rem !important;
    }
    nav .logo div {
      font-family: "Apoc", Georgia, serif;
      font-weight: 400;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }

    /* Header */
    header {
      margin-bottom: 4rem;
    }
    header h1 {
      font-family: "Apoc", Georgia, serif;
      font-weight: 400;
      text-transform: uppercase;
      font-size: clamp(2.75rem, 7vw, 4.5rem);
      line-height: 0.98;
      letter-spacing: -0.01em;
      color: #000;
      margin: 0 0 1.25rem 0;
      max-width: 14ch;
    }
    header h1::before {
      content: "TMRW Platform";
      display: block;
      font-family: "Brown", sans-serif;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--tmrw-ink);
      margin-bottom: 1.75rem;
    }
    header p.lead {
      font-family: "Crimson Text", Georgia, serif;
      font-size: 1.0625rem;
      line-height: 1.5;
      color: var(--tmrw-subtle);
      max-width: 42ch;
    }

    main section h1 {
      font-family: "Apoc", Georgia, serif;
      font-weight: 400;
      text-transform: uppercase;
      font-size: 2.5rem;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: #000;
      margin-bottom: 2rem;
    }

    /* Section headings become eyebrows over a hairline */
    main .f:not(.r) {
      border-bottom: 1px solid var(--tmrw-line);
      padding-bottom: 0.9rem;
      margin-bottom: 1.5rem;
      align-items: baseline;
    }
    main h2,
    main h3 {
      font-family: "Brown", sans-serif;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--tmrw-ink);
      opacity: 1;
      margin: 0;
    }
    section + h2 {
      margin-top: 4rem;
    }

    /* Period switcher */
    .r label {
      font-family: "Brown", sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tmrw-subtle);
    }
    .r input:checked + label {
      color: #000;
    }

    /* All-clear line reads as a statement; incidents keep card styling */
    main > article.up:not(.link) {
      border: 0;
      padding: 0;
      margin: 0 0 4rem 0;
      font-family: "Apoc", Georgia, serif;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      line-height: 1.2;
      text-transform: uppercase;
      color: #000;
    }
    main > article.up:not(.link)::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 0.75rem;
      vertical-align: 0.15em;
      background: var(--tmrw-up);
    }
    /* Cards */
    article {
      border-radius: 0;
      border: 1px solid var(--tmrw-line);
      padding: 1.5rem;
    }
    article + article {
      margin-top: -1px;
    }
    article.up,
    article.degraded,
    article.down {
      border-left-width: 1px !important;
    }
    article h4 {
      font-family: "Brown", sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    article h4 .icon {
      display: none !important;
    }
    article h4::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 0.6rem;
      vertical-align: 0.1em;
      background: var(--tmrw-subtle);
    }
    article.up h4::before {
      background: var(--tmrw-up);
    }
    article.degraded h4::before {
      background: var(--tmrw-degraded);
    }
    article.down h4::before {
      background: var(--tmrw-down);
    }

    /* Metrics read like the marketing stat cards */
    article > div {
      display: inline-block;
      vertical-align: top;
      margin-right: 3rem;
      font-family: "Brown", sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tmrw-subtle);
    }
    article .data {
      display: block;
      font-family: "Apoc", Georgia, serif;
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: 0.01em;
      color: #000;
      margin-top: 0.35rem;
      text-transform: none;
    }

    /* Graph moves to a pseudo-element so the filter hits it and not the card text */
    section article.graph {
      background-image: none !important;
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }
    section article.graph::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 42%;
      z-index: -1;
      pointer-events: none;
      background-image: var(--background);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center right;
      filter: grayscale(1) opacity(0.3);
    }

    /* Masking needs a CORS fetch, so it engages per graph once that fetch lands */
    section article.graph.tmrw-mask::after {
      background-image: none;
      background-color: var(--tmrw-up);
      filter: none;
      opacity: 0.3;
      -webkit-mask-image: var(--mask);
      mask-image: var(--mask);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center right;
      mask-position: center right;
    }
    section article.degraded.graph.tmrw-mask::after {
      background-color: var(--tmrw-degraded);
    }
    section article.down.graph.tmrw-mask::after {
      background-color: var(--tmrw-down);
    }

    /* Tags */
    /* #ff3300 and #9d8000 are too light to carry white text at 10px */
    .tag.down,
    .tag.open,
    .tag.degraded {
      color: var(--tmrw-ink);
    }

    .tag {
      font-family: "Brown", sans-serif;
      border-radius: 0;
      padding: 0.35rem 0.6rem;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    dl dt {
      font-family: "Brown", sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tmrw-subtle);
    }
    dl dd {
      font-family: "Apoc", Georgia, serif;
      font-size: 2rem;
      line-height: 1.2;
      color: #000;
    }

    /* Footer picks up the marketing site's black band */
    footer {
      margin-top: 7rem !important;
      padding: 3rem 2rem;
      background: #000;
      color: #b7b7b7;
      opacity: 1 !important;
      font-family: "Brown", sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    footer a {
      color: #f7f7f7;
      text-decoration: none;
      border-bottom: 1px solid #6f6f6f;
    }
  js: |
    (function () {
      var blobs = {};
      function sync() {
        document.querySelectorAll("article.graph").forEach(function (el) {
          var match = (el.style.getPropertyValue("--background") || "").match(/url\(['"]?(.+?)['"]?\)/);
          if (!match || el.dataset.maskSrc === match[1]) return;
          var src = (el.dataset.maskSrc = match[1]);
          el.classList.remove("tmrw-mask");
          el.style.removeProperty("--mask");
          blobs[src] =
            blobs[src] ||
            fetch(src)
              .then(function (r) {
                return r.blob();
              })
              .then(URL.createObjectURL);
          blobs[src].then(function (url) {
            if (el.dataset.maskSrc !== src) return;
            el.style.setProperty("--mask", 'url("' + url + '")');
            el.classList.add("tmrw-mask");
          }, function () {});
        });
      }
      new MutationObserver(sync).observe(document.documentElement, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ["style", "class"],
      });
      sync();
    })();

i18n:
  allSystemsOperational: All systems operational
  overallUptime: Uptime $UPTIME
  averageResponseTime: Response time $TIME
  overallUptimeTitle: Uptime
  averageResponseTimeTitle: Response time

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
